name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structure
        run: |
          test -f Package.swift
          test -d Sources/SwiftAsyncKit
          echo "OK"
